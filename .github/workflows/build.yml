name: Build Uni Tasks APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android Project Files
        run: |
          mkdir -p app/src/main/java/com/student/planner
          mkdir -p app/src/main/res/values

          echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' > settings.gradle
          echo 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' >> settings.gradle
          echo 'rootProject.name = "UniTasks"' >> settings.gradle
          echo 'include ":app"' >> settings.gradle

          echo 'plugins { id "com.android.application" version "8.3.0" apply false }' > build.gradle

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.student.planner'
              compileSdk 34
              defaultConfig {
                  applicationId "com.student.planner"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.VIBRATE" />
              
              <application
                  android:icon="@android:drawable/ic_menu_today"
                  android:label="المهام الجامعية"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver android:name=".AlarmReceiver" android:exported="false" />
                  
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/student/planner/AlarmReceiver.java
          package com.student.planner;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.media.RingtoneManager;
          import android.os.Build;
          import android.widget.Toast;

          public class AlarmReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  String taskName = intent.getStringExtra("task_name");
                  int taskId = intent.getIntExtra("task_id", 0);
                  
                  NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel("task_alerts", "تنبيهات المهام", NotificationManager.IMPORTANCE_HIGH);
                      channel.setDescription("تنبيهات قبل التسليم بـ 24 ساعة");
                      channel.enableVibration(true);
                      nm.createNotificationChannel(channel);
                  }
                  
                  Intent appIntent = new Intent(context, MainActivity.class);
                  PendingIntent pi = PendingIntent.getActivity(context, taskId, appIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  
                  android.app.Notification.Builder builder = null;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      builder = new android.app.Notification.Builder(context, "task_alerts");
                  } else {
                      builder = new android.app.Notification.Builder(context);
                  }
                  
                  builder.setSmallIcon(android.R.drawable.ic_dialog_alert)
                         .setContentTitle("تنبيه هام! ⚠️")
                         .setContentText("باقي 24 ساعة على تسليم: " + taskName)
                         .setAutoCancel(true)
                         .setContentIntent(pi)
                         .setSound(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION))
                         .setVibrate(new long[]{0, 500, 500, 500});
                         
                  nm.notify(taskId, builder.build());
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/student/planner/MainActivity.java
          package com.student.planner;
          import android.Manifest;
          import android.app.Activity;
          import android.app.AlarmManager;
          import android.app.DatePickerDialog;
          import android.app.PendingIntent;
          import android.app.TimePickerDialog;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.text.SimpleDateFormat;
          import java.util.Calendar;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private LinearLayout tasksContainer;
              private EditText taskInput;
              private Button dateTimeBtn;
              private Calendar selectedDeadline;
              private SharedPreferences prefs;
              
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("tasks_data", MODE_PRIVATE);
                  selectedDeadline = Calendar.getInstance();
                  
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                      }
                  }
                  
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(40, 40, 40, 40);
                  root.setBackgroundColor(Color.parseColor("#F5F5F5"));
                  
                  TextView title = new TextView(this);
                  title.setText("🎓 منظم المهام الجامعية");
                  title.setTextSize(26);
                  title.setTextColor(Color.parseColor("#1565C0"));
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, 0, 0, 40);
                  root.addView(title);
                  
                  taskInput = new EditText(this);
                  taskInput.setHint("اسم الكويز أو الأسايمنت...");
                  taskInput.setTextSize(18);
                  taskInput.setBackgroundColor(Color.WHITE);
                  taskInput.setPadding(30, 30, 30, 30);
                  root.addView(taskInput);
                  
                  dateTimeBtn = new Button(this);
                  dateTimeBtn.setText("📅 حدد ميعاد التسليم (الديدلاين)");
                  dateTimeBtn.setBackgroundColor(Color.parseColor("#42A5F5"));
                  dateTimeBtn.setTextColor(Color.WHITE);
                  dateTimeBtn.setOnClickListener(v -> showDateTimePicker());
                  LinearLayout.LayoutParams btnParams = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  btnParams.setMargins(0, 20, 0, 20);
                  root.addView(dateTimeBtn, btnParams);
                  
                  Button addBtn = new Button(this);
                  addBtn.setText("➕ إضافة المهمة");
                  addBtn.setBackgroundColor(Color.parseColor("#43A047"));
                  addBtn.setTextColor(Color.WHITE);
                  addBtn.setOnClickListener(v -> addTask());
                  root.addView(addBtn, btnParams);
                  
                  TextView subtitle = new TextView(this);
                  subtitle.setText("📋 المهام الحالية:");
                  subtitle.setTextSize(20);
                  subtitle.setTextColor(Color.BLACK);
                  subtitle.setPadding(0, 40, 0, 20);
                  root.addView(subtitle);
                  
                  ScrollView scroll = new ScrollView(this);
                  tasksContainer = new LinearLayout(this);
                  tasksContainer.setOrientation(LinearLayout.VERTICAL);
                  scroll.addView(tasksContainer);
                  root.addView(scroll);
                  
                  setContentView(root);
                  loadTasks();
              }
              
              private void showDateTimePicker() {
                  Calendar c = Calendar.getInstance();
                  new DatePickerDialog(this, (view, year, month, day) -> {
                      selectedDeadline.set(Calendar.YEAR, year);
                      selectedDeadline.set(Calendar.MONTH, month);
                      selectedDeadline.set(Calendar.DAY_OF_MONTH, day);
                      
                      new TimePickerDialog(this, (v, hour, min) -> {
                          selectedDeadline.set(Calendar.HOUR_OF_DAY, hour);
                          selectedDeadline.set(Calendar.MINUTE, min);
                          selectedDeadline.set(Calendar.SECOND, 0);
                          
                          SimpleDateFormat sdf = new SimpleDateFormat("yyyy-MM-dd hh:mm a", Locale.getDefault());
                          dateTimeBtn.setText(sdf.format(selectedDeadline.getTime()));
                      }, c.get(Calendar.HOUR_OF_DAY), c.get(Calendar.MINUTE), false).show();
                  }, c.get(Calendar.YEAR), c.get(Calendar.MONTH), c.get(Calendar.DAY_OF_MONTH)).show();
              }
              
              private void addTask() {
                  String name = taskInput.getText().toString().trim();
                  if (name.isEmpty()) {
                      Toast.makeText(this, "اكتب اسم المهمة أولاً", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  if (dateTimeBtn.getText().toString().contains("حدد ميعاد")) {
                      Toast.makeText(this, "الرجاء تحديد ميعاد التسليم", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  
                  int id = (int) System.currentTimeMillis();
                  long deadlineMs = selectedDeadline.getTimeInMillis();
                  
                  try {
                      JSONArray arr = new JSONArray(prefs.getString("tasks", "[]"));
                      JSONObject obj = new JSONObject();
                      obj.put("id", id);
                      obj.put("name", name);
                      obj.put("deadline", deadlineMs);
                      obj.put("isDone", false);
                      arr.put(obj);
                      prefs.edit().putString("tasks", arr.toString()).apply();
                      
                      scheduleNotification(id, name, deadlineMs);
                      
                      taskInput.setText("");
                      dateTimeBtn.setText("📅 حدد ميعاد التسليم (الديدلاين)");
                      loadTasks();
                      Toast.makeText(this, "تم إضافة المهمة وضبط المنبه!", Toast.LENGTH_SHORT).show();
                  } catch (Exception e) {}
              }
              
              private void loadTasks() {
                  tasksContainer.removeAllViews();
                  try {
                      JSONArray arr = new JSONArray(prefs.getString("tasks", "[]"));
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject obj = arr.getJSONObject(i);
                          createTaskView(obj, i);
                      }
                  } catch (Exception e) {}
              }
              
              private void createTaskView(JSONObject obj, int index) throws Exception {
                  int id = obj.getInt("id");
                  String name = obj.getString("name");
                  long deadline = obj.getLong("deadline");
                  boolean isDone = obj.getBoolean("isDone");
                  
                  LinearLayout item = new LinearLayout(this);
                  item.setOrientation(LinearLayout.HORIZONTAL);
                  item.setPadding(20, 20, 20, 20);
                  item.setBackgroundColor(Color.WHITE);
                  LinearLayout.LayoutParams itemParams = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  itemParams.setMargins(0, 0, 0, 20);
                  item.setLayoutParams(itemParams);
                  item.setGravity(Gravity.CENTER_VERTICAL);
                  
                  CheckBox cb = new CheckBox(this);
                  cb.setChecked(isDone);
                  
                  LinearLayout textLayout = new LinearLayout(this);
                  textLayout.setOrientation(LinearLayout.VERTICAL);
                  textLayout.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1.0f));
                  textLayout.setPadding(20, 0, 20, 0);
                  
                  TextView nameTv = new TextView(this);
                  nameTv.setText(name);
                  nameTv.setTextSize(18);
                  nameTv.setTextColor(Color.BLACK);
                  
                  TextView dateTv = new TextView(this);
                  SimpleDateFormat sdf = new SimpleDateFormat("yyyy-MM-dd hh:mm a", Locale.getDefault());
                  dateTv.setText("الديدلاين: " + sdf.format(deadline));
                  dateTv.setTextColor(Color.GRAY);
                  
                  if (isDone) {
                      nameTv.setPaintFlags(nameTv.getPaintFlags() | Paint.STRIKE_THRU_TEXT_FLAG);
                      nameTv.setTextColor(Color.GRAY);
                  }
                  
                  textLayout.addView(nameTv);
                  textLayout.addView(dateTv);
                  
                  Button delBtn = new Button(this);
                  delBtn.setText("🗑️");
                  delBtn.setBackgroundColor(Color.TRANSPARENT);
                  delBtn.setOnClickListener(v -> {
                      deleteTask(index, id);
                  });
                  
                  cb.setOnCheckedChangeListener((buttonView, isChecked) -> {
                      toggleTaskStatus(index, id, isChecked, nameTv);
                  });
                  
                  item.addView(cb);
                  item.addView(textLayout);
                  item.addView(delBtn);
                  tasksContainer.addView(item);
              }
              
              private void toggleTaskStatus(int index, int id, boolean isChecked, TextView nameTv) {
                  try {
                      JSONArray arr = new JSONArray(prefs.getString("tasks", "[]"));
                      JSONObject obj = arr.getJSONObject(index);
                      obj.put("isDone", isChecked);
                      prefs.edit().putString("tasks", arr.toString()).apply();
                      
                      if (isChecked) {
                          nameTv.setPaintFlags(nameTv.getPaintFlags() | Paint.STRIKE_THRU_TEXT_FLAG);
                          nameTv.setTextColor(Color.GRAY);
                          cancelNotification(id);
                      } else {
                          nameTv.setPaintFlags(nameTv.getPaintFlags() & (~Paint.STRIKE_THRU_TEXT_FLAG));
                          nameTv.setTextColor(Color.BLACK);
                          scheduleNotification(id, obj.getString("name"), obj.getLong("deadline"));
                      }
                  } catch (Exception e) {}
              }
              
              private void deleteTask(int index, int id) {
                  try {
                      JSONArray arr = new JSONArray(prefs.getString("tasks", "[]"));
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {
                          arr.remove(index);
                      } else {
                          JSONArray newArr = new JSONArray();
                          for (int i=0; i<arr.length(); i++) {
                              if (i != index) newArr.put(arr.getJSONObject(i));
                          }
                          arr = newArr;
                      }
                      prefs.edit().putString("tasks", arr.toString()).apply();
                      cancelNotification(id);
                      loadTasks();
                  } catch (Exception e) {}
              }
              
              private void scheduleNotification(int id, String name, long deadlineMs) {
                  long alarmTime = deadlineMs - (24 * 60 * 60 * 1000L); 
                  if (alarmTime <= System.currentTimeMillis()) return; 
                  
                  AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                  Intent intent = new Intent(this, AlarmReceiver.class);
                  intent.putExtra("task_id", id);
                  intent.putExtra("task_name", name);
                  
                  PendingIntent pi = PendingIntent.getBroadcast(this, id, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, alarmTime, pi);
                  } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {
                      am.setExact(AlarmManager.RTC_WAKEUP, alarmTime, pi);
                  } else {
                      am.set(AlarmManager.RTC_WAKEUP, alarmTime, pi);
                  }
              }
              
              private void cancelNotification(int id) {
                  AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                  Intent intent = new Intent(this, AlarmReceiver.class);
                  PendingIntent pi = PendingIntent.getBroadcast(this, id, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  am.cancel(pi);
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniTasks-APK
          path: app/build/outputs/apk/debug/app-debug.apk
